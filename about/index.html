<script>
(function () {
  var shell = document.querySelector('[data-pager-shell]')
  var body = document.body
  var bar = document.getElementById('rp-bar')
  var toggle = document.getElementById('readingToggle')
  var tocToggle = document.getElementById('tocToggle')
  var tocPanel = document.getElementById('tocPanel')
  var tocList = document.getElementById('tocList')
  var themeToggle = document.getElementById('themeToggle')
  if (!shell || !bar || !toggle || !tocToggle || !tocPanel || !tocList || !themeToggle) return

  // 判断当前是否为文章页
  function isArticle () {
    return !!shell.querySelector('.ContentView .PageTitle h1')
  }
  function updateUI () {
    var art = isArticle()
    // 工具栏全局常驻显示（深浅色模式任何页面都可用）
    body.classList.add('reading-available')
    // 目录按钮：仅文章页显示（有内容可索引）
    if (art) {
      tocToggle.style.display = ''
      buildToc()
    } else {
      tocToggle.style.display = 'none'
      tocPanel.classList.remove('toc-open')
    }
  }

  // 阅读进度条
  function onScroll () {
    var h = document.documentElement
    var max = h.scrollHeight - h.clientHeight
    var p = max > 0 ? (h.scrollTop || document.body.scrollTop) / max * 100 : 0
    bar.style.width = p + '%'
  }
  window.addEventListener('scroll', onScroll, { passive: true })
  onScroll()

  // 阅读模式开关
  toggle.addEventListener('click', function () {
    body.classList.toggle('reading-mode')
    tocPanel.classList.remove('toc-open')
    onScroll()
  })

  // 深浅色模式切换
  function applyTheme () {
    if (body.classList.contains('dark-mode')) {
      body.classList.remove('dark-mode')
      body.classList.add('light-mode')
    } else {
      body.classList.remove('light-mode')
      body.classList.add('dark-mode')
    }
  }
  themeToggle.addEventListener('click', applyTheme)

  // 目录生成：从文章内容提取 h2/h3
  function buildToc () {
    var content = shell.querySelector('.ContentView section')
    tocList.innerHTML = ''
    if (!content) return
    var heads = content.querySelectorAll('h2, h3')
    if (!heads.length) {
      tocPanel.classList.remove('toc-open')
      tocToggle.style.display = 'none'
      return
    }
    tocToggle.style.display = ''
    heads.forEach(function (h, i) {
      if (!h.id) h.id = 'toc-' + i
      var a = document.createElement('a')
      a.href = '#' + h.id
      a.textContent = h.textContent
      a.className = h.tagName === 'H3' ? 'toc-l2' : 'toc-l1'
      a.addEventListener('click', function (e) {
        e.preventDefault()
        e.stopPropagation()
        tocPanel.classList.remove('toc-open')
        h.scrollIntoView({ behavior: 'smooth', block: 'start' })
      })
      tocList.appendChild(a)
    })
  }

  // 目录抽屉开关
  tocToggle.addEventListener('click', function () {
    tocPanel.classList.toggle('toc-open')
  })
  document.addEventListener('click', function (e) {
    if (!tocPanel.classList.contains('toc-open')) return
    if (!tocPanel.contains(e.target) && e.target !== tocToggle) {
      tocPanel.classList.remove('toc-open')
    }
  })

  // SPA 路由切换后重新检测（shell 内容变化）
  var mo = new MutationObserver(updateUI)
  mo.observe(shell, { childList: true, subtree: true })
  updateUI()
})()
</script>
